[package]
name = "mqlc-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
mqlc-core.workspace = true
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client", "transport-child-process"] }
serde_json = "1.0.154"
testcontainers = "0.28.0"
