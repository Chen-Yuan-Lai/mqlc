[package]
name = "mqlc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3.34"
mongodb = "3.10.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }

[features]
testing = []

[dev-dependencies]
mqlc-core = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
