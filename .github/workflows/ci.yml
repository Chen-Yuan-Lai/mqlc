name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # The IR round-trip and coverage tests read every gold pipeline. The
      # pinned revision lives in fetch-data.sh, so its hash keys the cache.
      - uses: actions/cache@v4
        with:
          path: data/AptMQL-Bench
          key: aptmqlbench-${{ hashFiles('scripts/fetch-data.sh') }}
      - run: scripts/fetch-data.sh aptmqlbench_data.jsonl prompts/s51_text2mql_1time_completion.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Integration tests start mongo:8.2 through testcontainers (Docker is
      # available on GitHub-hosted Ubuntu runners).
      - run: cargo test --all-targets

  scoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoring
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Starts mongo:8.2 through testcontainers and downloads the pinned
      # official eval_script.py.
      - run: uv run pytest -q
